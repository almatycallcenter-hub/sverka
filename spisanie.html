<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F5F0">
<title>Фото списания — Тәп-Тәтті</title>
<style>
/* Утро, касса, коробка с продукцией в одной руке, телефон в другой. Поэтому:
   крупно, одно действие на строку, главная кнопка внизу под большим пальцем.
   Цвета и размеры — как у витрины: одна система, а не два разных приложения. */
:root{
  --bg:#F7F5F0;--card:#FFFFFF;--ink:#14110C;--mut:#6B6559;--line:#E6E3DD;
  --ok:#2C6B3F;--okBg:#EDF5EF;--warn:#8A5A00;--warnBg:#FFF6E0;--bad:#9B2C2C;--badBg:#FBEDED;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.45;padding:0 0 110px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;
  position:sticky;top:0;z-index:5}
.top h1{margin:0;font-size:18px;font-weight:700;line-height:1.25}
.top .sub{font-size:14px;color:var(--mut)}
main{max-width:760px;margin:0 auto;padding:12px 16px 0}
h2{font-size:15px;font-weight:700;margin:18px 2px 8px;color:var(--mut);
  text-transform:uppercase;letter-spacing:.03em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:9px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:15px}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.note{border-radius:12px;padding:12px 14px;font-size:15px;margin:12px 0}
.note.ok{background:var(--okBg);color:#1d4d31;border:1px solid #BFE0CB}
.note.warn{background:var(--warnBg);color:var(--warn);border:1px solid #F0D9A6}
.note.bad{background:var(--badBg);color:var(--bad);border:1px solid #E7C4C4}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.it{padding:12px 14px;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it .l1{display:flex;align-items:center;gap:10px}
.it .nm{flex:1;min-width:0;font-size:17px;line-height:1.3;overflow-wrap:break-word}
.it .pl{font-size:14px;color:var(--mut);margin-top:2px}
.it .pl b{color:var(--warn)}
.it .l2{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.st{display:flex;align-items:center;gap:4px}
.st button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);font-size:22px;font-weight:600;line-height:1}
.st input{width:72px;height:44px;text-align:center;border:1px solid var(--line);
  border-radius:12px;font-size:18px;font-weight:700;background:var(--card)}
.st .u{font-size:14px;color:var(--mut);margin-left:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:var(--card);padding:10px 12px;font-size:14px}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.x{flex:0 0 auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--mut);font-size:18px}
.add{display:block;width:100%;margin-top:10px;padding:13px;border-radius:12px;
  border:1px dashed #CFCAC0;background:transparent;font-size:16px;color:var(--ink)}
.find{display:block;width:100%;padding:13px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--card);margin-top:10px}
.found button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);
  background:var(--card);padding:12px 14px;font-size:16px}
.found button:first-child{border-top:0}
.found .c{font-size:13px;color:var(--mut)}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shot{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#ddd}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot button{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:999px;
  border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px}
.cam{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:16px;border-radius:14px;border:2px solid var(--ink);background:var(--card);
  font-size:17px;font-weight:700;margin-top:8px}
.hint{font-size:14px;color:var(--mut);margin:8px 2px 0}
textarea{display:block;width:100%;min-height:70px;padding:12px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--card);resize:vertical}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar button{display:block;width:100%;max-width:728px;margin:0 auto;padding:16px;border:0;
  border-radius:14px;background:var(--ok);color:#fff;font-size:17px;font-weight:700}
.bar button[disabled]{background:#B9B4AA}
.center{text-align:center;padding:48px 20px}
.center .big{font-size:52px;line-height:1}
.center h1{font-size:22px;margin:14px 0 6px}
.center p{color:var(--mut);margin:0 0 6px}
.hidden{display:none!important}
.chips button.has::after{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;
  background:var(--ok);margin-left:8px;vertical-align:middle}
.fld{display:block;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--card);margin-top:8px;font-size:16px}
.fld.miss{border-color:#E0B25A}
.lbl{font-size:13px;color:var(--mut);margin:10px 2px -2px}
.queue{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:18px 0 0}
.queue .q{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.queue .q:first-of-type{border-top:0}
.queue .q b{font-weight:600}
.queue .q .s{color:var(--mut);white-space:nowrap}
.queue .q .s.bad{color:var(--warn)}
.queue button{border:0;background:transparent;padding:0;text-align:left;font:inherit;color:inherit}
/* Камера на весь экран: видоискатель, сверху — место, внизу — затвор. */
.camv{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;color:#fff}
.camv video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.camv .geo{position:absolute;left:0;right:0;top:0;z-index:2;padding:calc(10px + env(safe-area-inset-top)) 14px 14px;
  font-size:14px;line-height:1.35;background:linear-gradient(rgba(0,0,0,.7),transparent)}
.camv .gbtn{margin-left:6px;padding:5px 12px;border-radius:999px;border:0;background:#fff;color:#000;
  font-size:13px;font-weight:700;vertical-align:middle}
.camv .gdiag{font-size:11px;color:#bbb;margin-top:4px}
.camv .stamp{position:absolute;right:14px;bottom:calc(118px + env(safe-area-inset-bottom));text-align:right;
  font-size:14px;line-height:1.3;text-shadow:0 1px 3px rgba(0,0,0,.95);pointer-events:none}
.camv .stamp b{font-size:16px;font-weight:600}
.camv .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .3s}
.camv .cbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#000;
  padding:14px 18px calc(14px + env(safe-area-inset-bottom))}
.camv .cx{flex:1;background:transparent;border:0;color:#fff;font-size:16px;font-weight:600;padding:10px 0;text-align:left}
.camv .cn{flex:1;text-align:right;font-size:15px;color:#ddd}
.camv .shut{flex:0 0 auto;width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:#fff;
  box-shadow:inset 0 0 0 4px #000}
.camv .shut[disabled]{opacity:.35}
.camv .err{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  text-align:center;padding:24px;font-size:16px}
.camv .err button{padding:14px 18px;border-radius:12px;border:0;background:#fff;color:#000;font-weight:700;font-size:16px}
</style>
</head>
<body>
<div class="top"><h1 id="ttl">📸 Фото списания</h1><div class="sub" id="sub">Загрузка…</div></div>
<main id="app"><div class="center"><p>Загрузка… / Жүктелуде…</p></div></main>
<div class="bar hidden" id="bar"><button id="go" disabled>Отправить</button></div>
<input type="file" id="file" accept="image/*" capture="environment" class="hidden">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="ttbar.js"></script>
<script>
(function(){
  'use strict';
  var API = 'https://script.google.com/macros/s/AKfycbyB2zMJldSSbflPVmWqlJxWvBcRrI1agvAnGSYHeUVdvVElOTxbs3dPszB_IdqOm88zyg/exec';
  var MAX_PHOTOS = 6, MAX_SIDE = 1600, QUALITY = 0.72;

  var TG = null;
  try{ TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData
              ? window.Telegram.WebApp : null; }catch(e){}
  if (TG){
    try{ TG.ready(); TG.expand(); }catch(e){}
    /* Свайп вниз в Телеграме сворачивает мини-приложение — а по этой странице
       как раз листают вниз к фото. Отключаем, чтобы форма не «улетала». */
    try{ TG.disableVerticalSwipes && TG.disableVerticalSwipes(); }catch(e){}
  }
  var INIT = TG ? TG.initData : '';
  var CODE = TG && TG.initDataUnsafe ? (TG.initDataUnsafe.start_param || '') : '';
  /* Вкладка «Фото» общего приложения передаёт филиал параметром ?c= */
  var C_ = TG ? (new URLSearchParams(location.search).get('c') || '') : '';
  if (/^[0-9a-f]{10}$/.test(C_)) CODE = 'ph' + C_;
  /* Кнопка «Отправить списки» ведёт в то же мини-приложение с кодом ls… —
     это вечерние списки на странице филиала, а не фото. */
  if (/^ls[0-9a-f]{10}$/.test(CODE)){ location.replace('index.html' + location.search + location.hash); return; }
  /* Кнопка «🥚 Кухня: заготовки» — код kx…, страница пекарей. */
  if (/^kx[0-9a-f]{10}$/.test(CODE)){ location.replace('kuhnya.html' + location.search + location.hash); return; }

  /* Весовые позиции — те же, что на странице филиала и в витрине. */
  /* По умолчанию; рабочий список приходит из таблицы (лист «Настройки»).
     Қатпарлы тоқаши считаются штучно — решение 13.10. */
  var WEIGHT = ['Печенье Вупи', 'Бауырсақ', 'Ірімшік ж/е картоп қосылған рогалик',
                'Көкнәр қосылған тоқаш'];
  function nrm(s){ return String(s == null ? '' : s).replace(/[ёЁ]/g,'е').replace(/["«»“”]/g,'')
                     .replace(/\s+/g,' ').trim().toLowerCase(); }
  var KG = {}; WEIGHT.forEach(function(n){ KG[nrm(n)] = 1; });
  function isKg(d){ return !!KG[nrm(d)]; }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                     .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function el(id){ return document.getElementById(id); }
  function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' +
                          String(d.getDate()).padStart(2,'0'); }
  function ddmm(s){ var p = s.split('-'); return p[2] + '.' + p[1]; }
  function r3(n){ return Math.round(Number(n) * 1000) / 1000; }

  /* Куда уходит позиция — запоминаем на телефоне по названию: у одной и той
     же продукции путь всегда один и тот же, выбирать каждое утро незачем. */
  var DKEY = 'tt_ph_dest';
  var DEST_MEM = {};
  try{ DEST_MEM = JSON.parse(localStorage.getItem(DKEY) || '{}'); }catch(e){}
  function rememberDest(d, v){ DEST_MEM[nrm(d)] = v; try{ localStorage.setItem(DKEY, JSON.stringify(DEST_MEM)); }catch(e){} }

  var today = new Date(), yest = new Date(); yest.setDate(today.getDate() - 1);
  var S = { day: iso(today), branch: '', items: [], photos: [], reason: 'По срокам', daily: 'По срокам',
            note: '', catalog: [], reasons: ['По срокам'], sentAt: '', adding: false, q: '', busy: false,
            bag: {}, other: [], sub: '' };
  /* Утреннее «по срокам» — по вечернему списку, одно на день. Остальные
     причины (7-й кофе, печенье к кофе, ДР…) — отдельные акты в течение дня:
     свой пустой список и своя «отправка», вторая не стирает первую. */
  function isDaily(){ return S.reason === S.daily; }
  function keyOf(r){ return r === S.daily ? 'daily' : r; }   // у каждой причины свой «карман»
  function newSub(){ return 'x' + Date.now() + Math.floor(Math.random() * 1000); }
  function needDest(r){ r = r || S.reason; return r === S.daily || r === 'По качеству'; }
  var DR = 'ДР сотрудника';
  var POSITIONS = ['Тех.персонал', 'Продавец', 'Посудомойщица', 'Помощник пекаря', 'Помощник кондитера',
    'Повар', 'Пекарь', 'Охранник', 'Оператор доставки', 'Менеджер по развитию', 'Менеджер по закупу',
    'Менеджер', 'Курьер', 'Кондитер', 'Кассир', 'Продавец-бармен', 'Заготовщица', 'Диспетчер',
    'Заведующий производством', 'Директор', 'Главный бухгалтер', 'Водитель', 'Бармен',
    'Заведующий складом', 'Администратор'].sort(function(a, b){ return a.localeCompare(b, 'ru'); });
  var NOTE_HINT = { 'ДР сотрудника': 'Чей день рождения?', 'Съёмка': 'Для чего съёмка, кто снимал',
    'Обучение (напитки)': 'Кого обучали', '7-й кофе бесплатно': 'Номер карты или чека (если есть)',
    'Печенье к кофе': 'К какому заказу / чеку', 'Другое': 'Обязательно: что случилось' };

  function api(body){
    body.init = INIT; body.code = CODE;
    return fetch(API, { method: 'POST', body: JSON.stringify(body) }).then(function(r){ return r.json(); });
  }

  function fail(msg){
    el('bar').classList.add('hidden');
    el('sub').textContent = '';
    el('app').innerHTML = '<div class="center"><div class="big">⚠️</div><h1>Не получилось открыть</h1><p>' +
      esc(msg) + '</p></div>';
  }

  function load(){
    if (!INIT) return fail('Откройте это приложение из Телеграма — кнопкой «📸 Отправить фото списания» в группе своего филиала.');
    el('app').innerHTML = '<div class="center"><p>Загрузка… / Жүктелуде…</p></div>';
    var t0 = Date.now();
    api({ action: 'ph_init', day: S.day }).then(function(r){
      if (!r || r.error) return fail((r && r.error) || 'Нет ответа от таблицы.');
      /* Часы телефона могут врать — время на штампе берём с сервера. */
      if (r.now > 1.6e12) OFF = r.now - Math.round((t0 + Date.now()) / 2);
      /* Весовые позиции — из таблицы (лист «Настройки»), если пришли. */
      if (Array.isArray(r.weight) && r.weight.length){ KG = {}; r.weight.forEach(function(n){ KG[nrm(n)] = 1; }); }
      S.branch = r.branch; S.catalog = r.catalog || []; S.reasons = r.reasons || S.reasons;
      S.daily = r.daily || S.daily; S.other = r.other || [];
      S.sentAt = r.sentAt || '';
      var plan = r.plan || [], sent = r.sent || [];
      var byPlan = {};
      plan.forEach(function(p){ byPlan[nrm(p.dish)] = p; });
      if (sent.length){
        /* Уже отправляли — показываем отправленное, чтобы поправить, а не набирать заново. */
        S.items = sent.map(function(s){
          var p = byPlan[nrm(s.dish)];
          return { dish: s.dish, cat: s.cat, plan: p ? p.qty : null, qty: s.qty, dest: s.dest, kg: isKg(s.dish) };
        });
        plan.forEach(function(p){
          if (!S.items.some(function(i){ return nrm(i.dish) === nrm(p.dish); }))
            S.items.push({ dish: p.dish, cat: p.cat, plan: p.qty, qty: 0, dest: DEST_MEM[nrm(p.dish)] || 'sklad', kg: isKg(p.dish) });
        });
      } else {
        S.items = plan.map(function(p){
          return { dish: p.dish, cat: p.cat, plan: p.qty, qty: p.qty,
                   dest: DEST_MEM[nrm(p.dish)] || 'sklad', kg: isKg(p.dish) };
        });
      }
      /* У каждой причины — свои позиции, свои фото, комментарий и черновик:
         переключение между «ДР», «Обучение», «По срокам» ничего не смешивает. */
      S.bag = { daily: S.items }; S.pbag = {}; S.restored = false;
      var last = null;
      function take(dr, legacy){
        if (!dr || !(dr.photos && dr.photos.length || dr.items && dr.items.length)) return;
        var k = keyOf(dr.reason || S.daily);
        if (k === 'daily' && sent.length && dr.at < Date.now() - 6 * 3600e3) return;
        if (legacy && k !== 'daily'){   // старый общий черновик — переносим в карман его причины
          try{ localStorage.setItem(draftKey(k), JSON.stringify(dr)); }catch(e){} }
        if (S.pbag[k] && S.pbag[k].at >= dr.at) return;
        if (dr.items) S.bag[k] = dr.items;
        S.pbag[k] = { photos: (dr.photos || []).map(ph), note: dr.note || '', sub: dr.sub || '', x: dr.x || null, at: dr.at || 0 };
        if (!last || dr.at > last.at) last = dr;
        S.restored = true;
      }
      take(readDraft('daily'), true);
      var old = null; try{ old = JSON.parse(localStorage.getItem(draftKey('daily') + '_x') || 'null'); }catch(e){}
      take(old, true); try{ localStorage.removeItem(draftKey('daily') + '_x'); }catch(e){}
      S.reasons.forEach(function(r){ if (keyOf(r) !== 'daily') take(readDraft(keyOf(r))); });
      if (S.keep){ S.reason = S.keep; S.keep = ''; }      // «＋ Новое списание» — остаёмся в той же причине
      else if (last) S.reason = last.reason || S.daily;
      if (S.reasons.indexOf(S.reason) < 0) S.reason = S.daily;
      useReason(S.reason);
      el('sub').textContent = S.branch + (r.user ? ' · ' + r.user : '');
      render();
    }).catch(function(){ fail('Нет связи с таблицей. Проверьте интернет и откройте ещё раз.'); });
  }

  function render(){
    var h = '';
    h += '<div class="chips">' +
      [[iso(today), 'Сегодня, ' + ddmm(iso(today))], [iso(yest), 'Вчера, ' + ddmm(iso(yest))]]
        .map(function(d){ return '<button data-day="' + d[0] + '"' + (S.day === d[0] ? ' class="on"' : '') + '>' + d[1] + '</button>'; }).join('') +
      '</div>';
    var filled = {}; acts().forEach(function(a){ filled[a.r] = 1; });   // точка — в этой причине уже что-то набрано
    h += '<h2>Причина / Себебі</h2><div class="chips">' + S.reasons.map(function(r){
      var c = (S.reason === r ? 'on' : '') + (filled[r] ? ' has' : '');
      return '<button data-r="' + esc(r) + '"' + (c ? ' class="' + c.trim() + '"' : '') + '>' + esc(r) + '</button>'; }).join('') + '</div>';
    if (S.restored)
      h += '<div class="note warn">Восстановили незаконченное — проверьте и нажмите «Отправить».</div>';
    if (isDaily()){
      if (S.sentAt)
        h += '<div class="note ok">✅ Уже отправлено в ' + esc(S.sentAt) + '. Можно поправить и отправить заново — прежняя запись заменится.</div>';
      var planned = S.items.filter(function(i){ return i.plan !== null; }).length;
      if (!planned)
        h += '<div class="note warn">Вечернего списка списания на ' + ddmm(S.day) + ' нет. Добавьте позиции вручную.</div>';
    } else {
      h += '<div class="note ok">Отдельный акт: добавьте позиции из этого акта. Прошлые отправки за день не заменятся.</div>';
    }
    if (S.other.length)
      h += '<div class="hint">Сегодня уже отправлены: ' + S.other.map(function(o){
        return esc(o.reason) + (o.time ? ' ' + esc(o.time) : '') + ' (' + o.n + ' поз.)'; }).join(', ') + '</div>';

    h += '<h2>Что списали / Есептен шығару</h2><div class="list">';
    if (!S.items.length) h += '<div class="it"><div class="pl">Пока пусто — добавьте позицию ниже.</div></div>';
    S.items.forEach(function(it, i){
      var diff = it.plan !== null && Math.abs(r3(it.plan) - r3(it.qty)) > 1e-9;
      h += '<div class="it"><div class="l1"><div class="nm">' + esc(it.dish) +
           (it.plan === null ? '' : '<div class="pl">вечером заявляли ' + r3(it.plan) + ' ' + (it.kg ? 'кг' : 'шт') +
             (diff ? ' · <b>не совпадает</b>' : '') + '</div>') +
           (it.plan === null && isDaily() ? '<div class="pl"><b>не было в вечернем списке</b></div>' : '') +
           '</div>' + (it.plan === null ? '<button class="x" data-del="' + i + '" aria-label="Убрать">✕</button>' : '') + '</div>' +
           '<div class="l2"><div class="st"><button data-m="' + i + '">−</button>' +
           '<input inputmode="decimal" data-q="' + i + '" value="' + r3(it.qty) + '">' +
           '<button data-p="' + i + '">+</button><span class="u">' + (it.kg ? 'кг' : 'шт') + '</span></div>' +
           (needDest() ? '<div class="seg"><button data-d="' + i + ':sklad"' + (it.dest !== 'akt' ? ' class="on"' : '') + '>Склад</button>' +
           '<button data-d="' + i + ':akt"' + (it.dest === 'akt' ? ' class="on"' : '') + '>Акт</button></div>' : '') + '</div></div>';
    });
    h += '</div>';
    if (S.adding){
      h += '<input class="find" id="find" placeholder="Начните писать название…" value="' + esc(S.q) + '" autocomplete="off">' +
           '<div class="list found" id="found" style="margin-top:8px"></div>';
    } else h += '<button class="add" id="add">＋ Добавить позицию</button>';
    if (needDest()) h += '<div class="hint">«Склад» — расходная на склад по срокам, «Акт» — акт списания на месте.</div>';

    h += '<h2>Фото / Сурет</h2><div class="shots">' + S.photos.map(function(p, i){
      return '<div class="shot"><img src="' + ph(p).src + '" alt=""><button data-dp="' + i + '" aria-label="Удалить фото">✕</button></div>'; }).join('') + '</div>';
    if (S.photos.length < MAX_PHOTOS)
      h += '<button class="cam" id="cam">📷 ' + (S.photos.length ? 'Ещё фото' : 'Сфотографировать') + '</button>';
    h += '<div class="hint">' + (S.reason === '7-й кофе бесплатно'
      ? 'В кадре — акт списания и карта с отметками. / Кадрда — акт және карта.'
      : 'В кадре — продукция и накладная или акт. / Кадрда — өнім және құжат.') +
      ' Снимаем только здесь — на фото ставится время и место. / Тек осында түсіреміз.</div>';

    if (S.reason === DR && S.x){
      /* Чей день рождения — отдельными полями, чтобы в таблице было одинаково у всех филиалов. */
      h += '<h2>Сотрудник / Қызметкер</h2>' +
        '<div class="lbl">Должность / Лауазымы</div>' +
        '<input class="fld" data-x="pos" list="poslist" placeholder="Например: Оператор доставки" value="' + esc(S.x.pos) + '" autocomplete="off">' +
        '<datalist id="poslist">' + POSITIONS.map(function(p){ return '<option value="' + esc(p) + '">'; }).join('') + '</datalist>' +
        '<div class="lbl">Имя и фамилия / Аты-жөні</div>' +
        '<input class="fld' + (S.x.fio.trim() ? '' : ' miss') + '" data-x="fio" placeholder="Например: Жания Байкенова" value="' + esc(S.x.fio) + '" autocomplete="off">' +
        '<div class="lbl">Дата дня рождения / Туған күні</div>' +
        '<input class="fld" data-x="date" type="date" value="' + esc(S.x.date || '') + '">';
    }
    h += '<h2>Комментарий</h2><textarea id="note" placeholder="' + esc(S.reason === DR ? 'Необязательно' : (NOTE_HINT[S.reason] || 'Необязательно')) + '">' + esc(S.note) + '</textarea>';
    var q = acts();
    if (q.length > 1 || (q.length === 1 && q[0].k !== keyOf(S.reason))){
      h += '<div class="queue"><h2 style="margin:4px 0 6px">Уйдёт одной кнопкой / Бір батырмамен</h2>' + q.map(function(a){
        return '<button class="q" data-r="' + esc(a.r) + '" style="display:flex;width:100%"><b>' + esc(a.r) + '</b><span class="s' + (a.problem ? ' bad' : '') + '">' +
          (a.problem || (a.n + ' поз. · ' + a.photos.length + ' фото')) + '</span></button>'; }).join('') + '</div>';
    }
    el('app').innerHTML = h;
    if (S.adding) { showFound(); var f = el('find'); f.focus(); f.oninput = function(){ S.q = f.value; showFound(); }; }
    bar();
  }

  function showFound(){
    var q = nrm(S.q), have = {};
    S.items.forEach(function(i){ have[nrm(i.dish)] = 1; });
    var list = q.length < 2 ? [] : S.catalog.filter(function(c){
      return !have[nrm(c[0])] && nrm(c[0]).indexOf(q) >= 0; }).slice(0, 12);
    el('found').innerHTML = list.length ? list.map(function(c){
      return '<button data-pick="' + esc(c[0]) + '" data-cat="' + esc(c[1]) + '">' + esc(c[0]) +
             (c[1] ? '<div class="c">' + esc(c[1]) + '</div>' : '') + '</button>'; }).join('')
      : '<button disabled class="c">' + (q.length < 2 ? 'Напишите хотя бы 2 буквы' : 'Не нашла в справочнике') + '</button>';
    /* Напитки и мелочь вроде «Латте 0,350 л» в справочнике витрины нет —
       такие позиции вписывают как есть, ровно как в акте. */
    if (q.length >= 2)
      el('found').innerHTML += '<button data-pick="' + esc(S.q.trim()) + '" data-cat="">＋ Добавить «' + esc(S.q.trim()) + '» как написано</button>';
  }

  /* Черновик на телефоне: если приложение закрылось (свайп, звонок, камера
     выгрузила Телеграм из памяти), набранное и фото не пропадают. */
  /* Черновик на каждую причину: «По срокам» — без хвоста, остальные — с названием причины. */
  function draftKey(k){ k = k || keyOf(S.reason);
    return 'tt_ph_draft_' + CODE + '_' + S.day + (k === 'daily' ? '' : '_r' + encodeURIComponent(k)); }
  /* Достать из кармана позиции, фото, комментарий и номер отправки выбранной причины. */
  function useReason(r){
    var k = keyOf(r), pb = S.pbag[k] || (S.pbag[k] = { photos: [], note: '', sub: '' });
    S.x = pb.x || (r === DR ? { fio: '', pos: '', date: S.day } : null);
    S.reason = r; S.items = S.bag[k] || (S.bag[k] = []);
    S.photos = pb.photos; S.note = pb.note; S.sub = pb.sub || '';
    if (k !== 'daily'){ if (!S.sub) S.sub = pb.sub = newSub();
      S.items.forEach(function(i){ if (!needDest()) i.dest = 'akt'; }); }
  }
  function stash(){ var k = keyOf(S.reason);
    S.bag[k] = S.items; S.pbag[k] = { photos: S.photos, note: S.note, sub: S.sub, x: S.x, at: Date.now() }; }
  function readDraft(m){ try{ return JSON.parse(localStorage.getItem(draftKey(m)) || 'null'); }catch(e){ return null; } }
  function saveDraft(){
    if (!S.branch || S.busy) return;   // во время отправки не пишем — иначе отправленное вернётся черновиком
    var d = { items: S.items, reason: S.reason, note: S.note, sub: S.sub, x: S.x, at: Date.now() };
    try{ localStorage.setItem(draftKey(), JSON.stringify(Object.assign({ photos: S.photos }, d))); }
    catch(e){ try{ localStorage.setItem(draftKey(), JSON.stringify(d)); }catch(e2){} }   // фото не влезли — хотя бы числа
    try{ if (TG){ S.photos.length ? TG.enableClosingConfirmation() : TG.disableClosingConfirmation(); } }catch(e){}
  }
  function dropDraft(k){ try{ localStorage.removeItem(draftKey(k)); }catch(e){}
    try{ TG && TG.disableClosingConfirmation(); }catch(e){} }

  function bar(){
    saveDraft();
    var b = el('go');
    el('bar').classList.remove('hidden');
    var q = acts(), bad = q.filter(function(a){ return a.problem; });
    var cur = q.filter(function(a){ return a.k === keyOf(S.reason); })[0];
    b.disabled = S.busy || !q.length || bad.length > 0;
    b.textContent = S.busy ? 'Отправляю…' + (S.prog ? ' ' + S.prog : '') :
      !q.length ? 'Добавьте фото' :
      bad.length ? (bad[0].k === keyOf(S.reason) ? ({ 'нет фото': 'Добавьте фото', 'нет позиций': 'Добавьте позицию', 'нет комментария': 'Напишите комментарий',
                                                   'не указан сотрудник': 'Впишите сотрудника' })[bad[0].problem]
                                                 : bad[0].r + ': ' + bad[0].problem) :
      q.length === 1 && cur ? 'Отправить · ' + cur.n + ' поз. · ' + cur.photos.length + ' фото' :
      q.length === 1 ? 'Отправить «' + q[0].r + '» · ' + q[0].n + ' поз.' :
      'Отправить всё · ' + q.length + ' ' + (q.length < 5 ? 'акта' : 'актов');
  }

  function step(i, sign){
    var it = S.items[i], d = it.kg ? 0.1 : 1;
    it.qty = Math.max(0, r3(Number(it.qty || 0) + sign * d));
    render();
  }

  document.addEventListener('click', function(e){
    var t = e.target.closest('button'); if (!t) return;
    var a;
    if (t.id === 'cshot') return camShot();
    if (t.id === 'cclose') return camClose();
    if (t.id === 'cfile'){ el('file').click(); return; }
    if (t.id === 'cgeo-btn') return geoFix();
    if ((a = t.getAttribute('data-day'))){ if (a !== S.day){ S.day = a; S.photos = []; load(); } return; }
    if ((a = t.getAttribute('data-m')) !== null) return step(+a, -1);
    if ((a = t.getAttribute('data-p')) !== null) return step(+a, 1);
    if ((a = t.getAttribute('data-d'))){ var p = a.split(':'); S.items[+p[0]].dest = p[1];
      rememberDest(S.items[+p[0]].dish, p[1]); return render(); }
    if ((a = t.getAttribute('data-del')) !== null){ S.items.splice(+a, 1); return render(); }
    if ((a = t.getAttribute('data-r'))){
      if (a === S.reason) return;
      stash(); useReason(a);
      return render();
    }
    if ((a = t.getAttribute('data-dp')) !== null){ S.photos.splice(+a, 1); return render(); }
    if ((a = t.getAttribute('data-pick'))){
      S.items.push({ dish: a, cat: t.getAttribute('data-cat') || '', plan: null, qty: isKg(a) ? 0.5 : 1,
                     dest: needDest() ? (DEST_MEM[nrm(a)] || 'sklad') : 'akt', kg: isKg(a) });
      S.adding = false; S.q = ''; return render();
    }
    if (t.id === 'add'){ S.adding = true; return render(); }
    if (t.id === 'cam') return camOpen();
  });
  document.addEventListener('change', function(e){
    var a = e.target.getAttribute && e.target.getAttribute('data-q');
    if (a !== null && a !== undefined){
      var v = parseFloat(String(e.target.value).replace(',', '.'));
      S.items[+a].qty = isFinite(v) && v >= 0 ? r3(v) : 0; render();
    }
  });
  document.addEventListener('input', function(e){
    if (e.target.id === 'note'){ S.note = e.target.value; bar(); }
    var x = e.target.getAttribute && e.target.getAttribute('data-x');
    if (x && S.x){ S.x[x] = e.target.value;
      if (x === 'fio') e.target.classList.toggle('miss', !e.target.value.trim()); bar(); }
  });

  /* ── Камера в приложении ─────────────────────────────────────────────
     Фото снимаются только здесь: старое из галереи выбрать нельзя. На каждый
     кадр ставится штамп, как у камер с отметкой: дата и время (по часам
     сервера, а не телефона), район и город по геолокации, филиал. Время,
     координаты и «отпечаток» кадра уходят в таблицу — по ним видно повторы
     и фото, снятые не на месте. */
  var OFF = 0;                 // поправка часов телефона к серверу, мс
  var GEO = null;              // { lat, lon, acc, district, city, at }
  var GEO_STATE = '';          // '' | 'wait' | 'ok' | 'no'
  var GEO_WHY = '';            // почему нет места: tg-denied | denied | timeout | no-fix | no-api
  var CAM = null;              // открытая камера
  var FRESH_MS = 5 * 60e3;     // запасной путь: снимок камерой телефона не старше 5 минут
  var MON = ['янв.', 'февр.', 'мар.', 'апр.', 'мая', 'июн.', 'июл.', 'авг.', 'сент.', 'окт.', 'нояб.', 'дек.'];

  /* Фото — { src, m }. Черновики прошлой версии хранили просто строку. */
  function ph(p){ return typeof p === 'string' ? { src: p, m: { src: 'old' } } : (p || { src: '', m: {} }); }
  function srvNow(){ return Date.now() + OFF; }
  /* Алматы — UTC+5 (с марта 2024). Считаем сами: в старых телефонах
     база часовых поясов ещё со старым +6. */
  function stampTime(ms){
    var d = new Date(ms + 5 * 3600e3), p = function(n){ return (n < 10 ? '0' : '') + n; };
    return d.getUTCDate() + ' ' + MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear() + ' г. ' +
           p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':' + p(d.getUTCSeconds());
  }
  function geoPlace(){ return GEO ? [GEO.district, GEO.city].filter(Boolean).join(', ') : ''; }
  function stampLines(ms){
    var l = [stampTime(ms)];
    if (GEO && (GEO.district || GEO.city)){ if (GEO.district) l.push(GEO.district); if (GEO.city) l.push(GEO.city); }
    else if (GEO) l.push(GEO.lat.toFixed(5) + ', ' + GEO.lon.toFixed(5));
    if (S.branch) l.push(S.branch);
    return l;
  }

  /* Место ищем сразу двумя путями — через Телеграм (LocationManager) и
     через браузер; что ответит первым, то и берём. Браузер сначала просим
     о быстром месте по Wi-Fi и вышкам (в помещении GPS может не поймать),
     потом, если точность хуже 200 м, уточняем по GPS. GEO_DIAG — короткий
     код, что ответил каждый путь: по нему видно, где застряло. */
  var GEO_DIAG = '';
  function geoStart(){
    if (GEO_STATE === 'wait' || (GEO && Date.now() - GEO.at < 10 * 60e3)) return;
    GEO_STATE = 'wait'; GEO_WHY = ''; camInfo();
    var done = false, fails = {}, ways = 0, timer = setTimeout(function(){ none('timeout'); }, 30000);
    var diag = { tg: (TG && TG.version) || '-', lm: '-', br: '-' };
    function D(){ GEO_DIAG = 'TG ' + diag.tg + ' · tg:' + diag.lm + ' · br:' + diag.br; }
    D();
    function got(lat, lon, acc, via){
      if (GEO && GEO_STATE === 'ok' && !(acc < GEO.acc)) return;   // уже есть место не хуже
      var first = !done; done = true; clearTimeout(timer);
      GEO = { lat: Number(lat), lon: Number(lon), acc: Math.round(Number(acc) || 0),
              district: GEO && !first ? GEO.district : '', city: GEO && !first ? GEO.city : '', at: Date.now(), via: via };
      GEO_STATE = 'ok'; camInfo();
      api({ action: 'ph_geo', lat: GEO.lat, lon: GEO.lon }).then(function(r){
        if (r && r.ok && GEO){ GEO.district = r.district || GEO.district; GEO.city = r.city || GEO.city; camInfo(); }
      }).catch(function(){});
    }
    function none(why){ if (done) return; done = true; clearTimeout(timer);
      GEO_STATE = 'no'; GEO_WHY = why || 'no-fix'; D(); camInfo(); }
    function fail(way, why){ fails[way] = why; D();
      if (Object.keys(fails).length < ways) return;               // другой путь ещё ищет
      none(fails.lm === 'tg-denied' ? 'tg-denied' : fails.br === 'denied' ? 'denied' :
           fails.lm === 'timeout' || fails.br === 'timeout' ? 'timeout' : fails.br || fails.lm); }
    function browser(){
      if (!navigator.geolocation){ diag.br = 'нет'; return; }
      ways++;
      var hi = false;
      function ask(high){
        try{
          navigator.geolocation.getCurrentPosition(function(p){
            diag.br = (high ? 'gps ' : 'ok ') + Math.round(p.coords.accuracy) + 'м'; D();
            got(p.coords.latitude, p.coords.longitude, p.coords.accuracy, 'br');
            if (!high && p.coords.accuracy > 200 && !hi){ hi = true; ask(true); }
          }, function(e){
            diag.br = 'err' + (e && e.code); D();
            if (high) return;                                      // уточнение не вышло — оставляем что есть
            fail('br', e && e.code === 1 ? 'denied' : e && e.code === 3 ? 'timeout' : 'no-fix');
          }, { enableHighAccuracy: high, timeout: high ? 25000 : 20000, maximumAge: high ? 0 : 300000 });
        }catch(e){ diag.br = 'исключение'; if (!high) fail('br', 'no-api'); }
      }
      ask(false);
    }
    function telegram(){
      var LM = TG && TG.LocationManager;
      if (!(LM && TG.isVersionAtLeast && TG.isVersionAtLeast('8.0'))){ diag.lm = 'нет'; return; }
      ways++;
      var go = function(){
        diag.lm = 'a' + (LM.isLocationAvailable ? 1 : 0) + 'r' + (LM.isAccessRequested ? 1 : 0) + 'g' + (LM.isAccessGranted ? 1 : 0); D();
        if (!LM.isLocationAvailable) return fail('lm', 'no-fix');
        LM.getLocation(function(d){
          if (d){ diag.lm += ' ok'; D(); return got(d.latitude, d.longitude, d.horizontal_accuracy, 'tg'); }
          diag.lm = 'a1r' + (LM.isAccessRequested ? 1 : 0) + 'g' + (LM.isAccessGranted ? 1 : 0) + ' пусто';
          fail('lm', LM.isAccessRequested && !LM.isAccessGranted ? 'tg-denied' : 'no-fix');
        });
      };
      try{ LM.isInited ? go() : LM.init(go); }catch(e){ diag.lm = 'исключение'; fail('lm', 'no-fix'); }
    }
    telegram(); browser();
    if (!ways) none('no-api');
  }
  /* Кнопка в полосе места. Телеграм запретил доступ — открываем настройки
     бота (там переключатель «Геолокация»); иначе просто пробуем ещё раз. */
  function geoFix(){
    var LM = TG && TG.LocationManager;
    if (GEO_WHY === 'tg-denied' && LM && LM.openSettings){ try{ LM.openSettings(); return; }catch(e){} }
    GEO_STATE = ''; GEO_WHY = ''; geoStart();
  }
  /* Вернулись из настроек с разрешением — сразу пробуем снова. */
  try{ TG && TG.onEvent && TG.onEvent('locationManagerUpdated', function(){
    if (GEO_STATE === 'no'){ GEO_STATE = ''; GEO_WHY = ''; geoStart(); } }); }catch(e){}
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && CAM && GEO_STATE === 'no'){ GEO_STATE = ''; GEO_WHY = ''; geoStart(); } });

  function camOpen(){
    if (CAM || S.photos.length >= MAX_PHOTOS) return;
    geoStart();
    var box = document.createElement('div');
    box.className = 'camv'; box.id = 'camv';
    box.innerHTML = '<div class="geo" id="cgeo"></div>' +
      '<video id="cvid" playsinline autoplay muted></video>' +
      '<div class="stamp" id="cst"></div><div class="flash" id="cfl"></div>' +
      '<div class="cbar"><button class="cx" id="cclose">✕ Готово</button>' +
      '<button class="shut" id="cshot" aria-label="Снять" disabled></button><span class="cn" id="ccnt"></span></div>';
    document.body.appendChild(box);
    CAM = { box: box, stream: null, timer: setInterval(camInfo, 1000) };
    camInfo();
    var md = navigator.mediaDevices;
    if (!md || !md.getUserMedia) return camFail('');
    md.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' },
                                             width: { ideal: 1920 }, height: { ideal: 1440 } } })
      .then(function(st){
        if (!CAM){ st.getTracks().forEach(function(t){ t.stop(); }); return; }
        CAM.stream = st;
        var v = el('cvid');
        v.addEventListener('loadedmetadata', camInfo); v.addEventListener('playing', camInfo);
        v.srcObject = st;
        var p = v.play(); if (p && p.catch) p.catch(function(){});
      })
      .catch(function(e){ camFail(e && e.name); });
  }
  /* Камера в приложении не открылась. Запасной путь — камера телефона
     (не галерея), и только свежий снимок; в карточке это будет отмечено. */
  function camFail(name){
    if (!CAM) return;
    var v = el('cvid'); if (v) v.remove();
    var s = el('cst'); if (s) s.remove();
    var d = document.createElement('div'); d.className = 'err';
    d.innerHTML = '<div style="font-size:44px">📷</div><div>' + (name === 'NotAllowedError'
      ? 'Нет доступа к камере. Разрешите Телеграму камеру в настройках телефона и откройте ещё раз.'
      : 'Камера в приложении не открылась.') + '</div>' +
      '<button id="cfile">Открыть камеру телефона</button>' +
      '<div style="font-size:13px;color:#bbb">Подойдёт только снимок, сделанный сейчас. / Тек қазір түсірілген сурет.</div>';
    CAM.box.insertBefore(d, CAM.box.querySelector('.flash'));
    camInfo();
  }
  function camClose(){
    if (!CAM) return;
    clearInterval(CAM.timer);
    if (CAM.stream) CAM.stream.getTracks().forEach(function(t){ try{ t.stop(); }catch(e){} });
    CAM.box.remove(); CAM = null;
    render();
  }
  function camInfo(){
    if (!CAM) return;
    var g = el('cgeo');
    if (g){
      var gt = GEO_STATE === 'wait' ? '📍 Определяю место…' :
        GEO_STATE === 'ok' ? '📍 ' + (geoPlace() || 'Место получено') + (GEO && GEO.acc > 300 ? ' · точность ~' + GEO.acc + ' м' : '') : '';
      var gb = '';
      if (GEO_STATE === 'no'){
        gt = ({
          'tg-denied': '📍 Телеграм не дал доступ к месту. Нажмите «Разрешить» и включите «Геолокация».',
          'denied':    '📍 Геолокация запрещена. Настройки телефона → Telegram → Геопозиция → «При использовании».',
          'timeout':   '📍 Место не определилось — включите геолокацию на телефоне.',
          'no-api':    '📍 Этот Телеграм не умеет передавать место — обновите Телеграм.'
        })[GEO_WHY] || '📍 Место не определилось.';
        gt += ' Фото примем и без места.';
        gb = GEO_WHY === 'tg-denied' ? 'Разрешить' : 'Ещё раз';
      }
      if (g.getAttribute('data-t') !== gt + gb + GEO_DIAG){
        g.setAttribute('data-t', gt + gb + GEO_DIAG);
        g.innerHTML = esc(gt) + (gb ? ' <button class="gbtn" id="cgeo-btn">' + esc(gb) + '</button>' : '') +
          (GEO_STATE === 'no' && GEO_DIAG ? '<div class="gdiag">' + esc(GEO_DIAG) + '</div>' : '');
      }
    }
    var st = el('cst');
    if (st){ var l = stampLines(srvNow());
      st.innerHTML = '<b>' + esc(l[0]) + '</b>' + l.slice(1).map(function(x){ return '<br>' + esc(x); }).join(''); }
    var c = el('ccnt'); if (c) c.textContent = S.photos.length + ' из ' + MAX_PHOTOS;
    var v = el('cvid'), b = el('cshot');
    if (b) b.disabled = !(v && v.videoWidth) || S.photos.length >= MAX_PHOTOS;
  }
  function camShot(){
    var v = el('cvid');
    if (!CAM || !v || !v.videoWidth || S.photos.length >= MAX_PHOTOS) return;
    var ms = srvNow(), k = Math.min(1, MAX_SIDE / Math.max(v.videoWidth, v.videoHeight));
    var c = document.createElement('canvas');
    c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    addPhoto(c, ms, 'cam');
    var f = el('cfl'); if (f){ f.style.opacity = '.8'; setTimeout(function(){ f.style.opacity = '0'; }, 60); }
    try{ TG && TG.HapticFeedback && TG.HapticFeedback.impactOccurred('medium'); }catch(e){}
    render(); camInfo();
    if (S.photos.length >= MAX_PHOTOS) setTimeout(camClose, 400);
  }
  function addPhoto(c, ms, src){
    var h = dhash(c);
    drawStamp(c, stampLines(ms));
    S.photos.push({ src: c.toDataURL('image/jpeg', QUALITY),
      m: { t: ms, src: src, h: h, lat: GEO ? GEO.lat : null, lon: GEO ? GEO.lon : null,
           acc: GEO ? GEO.acc : null, place: geoPlace() } });
  }
  /* Штамп — справа внизу, белым с тенью: читается и на светлой витрине. */
  function drawStamp(c, lines){
    var g = c.getContext('2d'), W = c.width, H = c.height;
    var base = Math.max(14, Math.round(Math.min(W, H) * 0.038)), pad = Math.round(base * 0.8), y = H - pad;
    g.textAlign = 'right'; g.textBaseline = 'bottom'; g.fillStyle = '#fff';
    g.shadowColor = 'rgba(0,0,0,.9)'; g.shadowBlur = Math.max(2, Math.round(base * 0.3)); g.shadowOffsetY = 1;
    for (var i = lines.length - 1; i >= 0; i--){
      var fs = i === 0 ? base : Math.round(base * 0.86);
      g.font = (i === 0 ? '600 ' : '500 ') + fs + 'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
      g.fillText(lines[i], W - pad, y);
      y -= Math.round(fs * 1.28);
    }
    g.shadowBlur = 0; g.shadowOffsetY = 0;
  }
  /* «Отпечаток» кадра (dHash, 64 бита): одно и то же фото, присланное
     повторно, даёт почти тот же отпечаток. Считаем до штампа. */
  function dhash(c){
    var m = document.createElement('canvas'); m.width = 72; m.height = 64;
    var gm = m.getContext('2d'); gm.drawImage(c, 0, 0, 72, 64);
    var s = document.createElement('canvas'); s.width = 9; s.height = 8;
    var g = s.getContext('2d'); g.drawImage(m, 0, 0, 9, 8);
    var d = g.getImageData(0, 0, 9, 8).data, bits = '', hex = '';
    function L(i){ return d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114; }
    for (var y = 0; y < 8; y++) for (var x = 0; x < 8; x++){
      var i = (y * 9 + x) * 4; bits += L(i) > L(i + 4) ? '1' : '0';
    }
    for (var q = 0; q < 64; q += 4) hex += parseInt(bits.slice(q, q + 4), 2).toString(16);
    return hex;
  }
  function loadImg(file){
    return new Promise(function(ok, no){
      var fr = new FileReader();
      fr.onload = function(){ var img = new Image(); img.onload = function(){ ok(img); }; img.onerror = no; img.src = fr.result; };
      fr.onerror = no; fr.readAsDataURL(file);
    });
  }
  /* Запасной путь: камера телефона. Старый снимок (из галереи) не берём. */
  el('file').addEventListener('change', function(){
    var f = (this.files || [])[0]; this.value = '';
    if (!f || S.photos.length >= MAX_PHOTOS) return;
    var age = Date.now() - (Number(f.lastModified) || 0);
    if (!(age > -120e3 && age < FRESH_MS))
      return alertMsg('Это фото снято не сейчас. Нужна новая фотография — снимите заново. / Жаңа сурет түсіріңіз.');
    loadImg(f).then(function(img){
      var k = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      addPhoto(c, srvNow() - Math.max(0, age), 'file');
      render(); camInfo();
    }).catch(function(){ alertMsg('Не получилось прочитать фото. Попробуйте ещё раз.'); });
  });

  function alertMsg(m){ try{ if (TG) return TG.showAlert(m); }catch(e){} alert(m); }

  /* Всё, что набрано по разным причинам, — список актов к отправке.
     «По срокам» попадает в список, только когда к нему добавили фото. */
  function acts(){
    stash();
    var out = [];
    S.reasons.forEach(function(r){
      var k = keyOf(r), pb = S.pbag[k], items = S.bag[k] || [];
      if (!pb) return;
      var n = items.filter(function(i){ return Number(i.qty) > 0; }).length;
      var photos = pb.photos || [];
      if (!photos.length && (k === 'daily' || !n)) return;
      var x = pb.x, note = String(pb.note || '').trim();
      var problem = !photos.length ? 'нет фото' : !n ? 'нет позиций' :
        (r === 'Другое' && !note) ? 'нет комментария' :
        (r === DR && !(x && String(x.fio || '').trim())) ? 'не указан сотрудник' : '';
      out.push({ k: k, r: r, items: items, n: n, photos: photos, note: note, x: x, sub: pb.sub || '', problem: problem });
    });
    return out;
  }
  function fullNote(a){
    if (a.r !== DR || !a.x) return a.note;
    var d = a.x.date ? a.x.date.split('-').reverse().join('.') : '';
    var who = [String(a.x.pos || '').trim(), String(a.x.fio || '').trim()].filter(Boolean).join(' — ');
    return who + (d ? ', ДР ' + d : '') + (a.note ? '\n' + a.note : '');
  }
  function payload(a){
    var daily = a.k === 'daily';
    var items = a.items.filter(function(i){ return Number(i.qty) > 0 || (daily && i.plan !== null); })
      .map(function(i){ return { dish: i.dish, cat: i.cat, qty: r3(i.qty), plan: daily ? i.plan : null,
                                 dest: needDest(a.r) ? i.dest : 'akt', kg: i.kg ? 1 : 0 }; });
    var ps = a.photos.map(ph);
    return { action: 'ph_send', day: S.day, items: items, photos: ps.map(function(p){ return p.src; }),
             meta: ps.map(function(p){ return p.m || {}; }), reason: a.r, note: fullNote(a),
             sub: daily ? '' : (a.sub || newSub()) };
  }

  el('go').addEventListener('click', function(){
    if (S.busy) return;
    var q = acts();
    if (!q.length || q.some(function(a){ return a.problem; })) return bar();
    var done = [], i = 0;
    S.busy = true; S.prog = ''; bar();
    /* По одному акту за раз: у каждого своя карточка в группе и свои строки в таблице. */
    (function next(){
      if (i >= q.length) return finish();
      if (q.length > 1){ S.prog = (i + 1) + ' из ' + q.length; bar(); }
      var a = q[i];
      api(payload(a)).then(function(r){
        if (!r || r.error) throw new Error((r && r.error) || 'Не отправилось.');
        done.push({ a: a, r: r }); dropDraft(a.k); i++; next();
      }).catch(function(err){
        S.busy = false; S.prog = '';
        var msg = (err && err.message && err.message !== 'Failed to fetch') ? err.message : 'Нет связи.';
        if (!done.length){ bar(); return alertMsg(msg + ' Всё осталось здесь — нажмите «Отправить» ещё раз.'); }
        alertMsg('Ушло: ' + done.map(function(d){ return d.a.r; }).join(', ') + '. Не ушло: ' +
          q.slice(i).map(function(a){ return a.r; }).join(', ') + ' — ' + msg + ' Нажмите «Отправить» ещё раз.');
        S.keep = q[i].r; load();
      });
    })();
    function finish(){
      S.busy = false; S.prog = '';
      try{ TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred('success'); }catch(e){}
      try{ TG && TG.disableClosingConfirmation(); }catch(e){}
      el('bar').classList.add('hidden');
      var one = done.length === 1 ? done[0] : null;
      el('app').innerHTML = '<div class="center"><div class="big">✅</div><h1>Отправлено / Жіберілді</h1>' +
        '<p>' + esc(S.branch) + ' · ' + ddmm(S.day) + '</p>' +
        done.map(function(d){ return '<p>' + esc(d.a.r) + ' · ' + d.r.saved + ' поз.' + (d.r.warn ? ' · ' + esc(d.r.warn) : '') + '</p>'; }).join('') +
        '<p>' + (done.length > 1 ? 'Карточки ушли' : 'Карточка ушла') + ' в группу списаний в Телеграме.</p>' +
        (one ? '<p style="margin-top:18px"><button class="add" id="fix">Исправить эту отправку</button></p>' : '<p style="margin-top:18px"></p>') +
        '<p><button class="add" id="next">＋ Новое списание</button></p></div>';
      /* «Исправить» — та же отправка (заменит себя), «Новое» — чистый лист той же причины. */
      if (one) el('fix').onclick = function(){ useReason(one.a.r); if (one.r.sub && one.a.k !== 'daily') S.sub = one.r.sub; render(); };
      el('next').onclick = function(){ S.keep = one ? one.a.r : S.reason; load(); };
    }
  });

  load();
})();
</script>
