<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F5F0">
<title>Что со скидкой — Тәп-Тәтті</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b8892b'/%3E%3Ctext x='32' y='44' font-family='sans-serif' font-size='30' font-weight='700' fill='%23fff' text-anchor='middle'%3E50%25%3C/text%3E%3C/svg%3E">
<style>
/* Витрину открывают сотрудники, среди них пожилые. Отсюда всё остальное:
   крупный шрифт, чёрным по светлому, одно решение на экран и единственная
   кнопка внизу, до которой дотягивается большой палец.

   Путь короткий и всегда один и тот же: филиал → продукция → корзина →
   получение → готово. Раньше это была одна длинная лента всех филиалов
   сразу — на телефоне она превращалась в отчёт об остатках, а должна
   ощущаться как простой магазин. */
:root{
  --bg:#F7F5F0;
  --card:#FFFFFF;
  --ink:#14110C;
  --mut:#6B6559;
  --line:#E6E3DD;      /* светло-серые разделители вместо бежевых рамок */
  --gold:#8A6516;
  --ok:#2C6B3F;
  --okBg:#EDF5EF;
  --shadow:0 1px 0 rgba(20,17,12,.04);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.45;
  padding:0 0 96px;                 /* место под нижнюю панель */
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}

/* ── шапка: одна строка, не липкая ── */
.top{
  background:var(--card);border-bottom:1px solid var(--line);
  padding:12px 16px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:5;
}
.top .back{
  flex:0 0 auto;width:40px;height:40px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);
  font-size:22px;line-height:1;display:none;
}
.top .ttl{flex:1;min-width:0}
.top h1{margin:0;font-size:17px;font-weight:600;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:14px;color:var(--mut);line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .upd{
  flex:0 0 auto;width:40px;height:40px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1;
}
.top .upd[disabled]{opacity:.5}

main{max-width:760px;margin:0 auto;padding:12px 16px 0}

/* ── поиск ── */
.find{
  display:block;width:100%;padding:13px 14px;margin-bottom:12px;
  border:1px solid var(--line);border-radius:12px;background:var(--card);
}
.find:focus{outline:none;border-color:var(--ok)}

/* ── полоска категорий ── */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{
  flex:0 0 auto;padding:8px 14px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);font-size:15px;white-space:nowrap;
}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}

/* ── список: филиалы и продукция одной разметкой ── */
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.row{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  border-top:1px solid var(--line);
}
.row:first-child{border-top:0}
.row .txt{flex:1;min-width:0}
.row .nm{font-size:17px;line-height:1.3;overflow-wrap:break-word}
.row .sub{font-size:14px;color:var(--mut);margin-top:2px}
/* Своя бронь на экране филиалов и плашка правки — один и тот же зелёный:
   человек должен узнавать «это про меня» с одного взгляда. */
.row .mine{font-size:14px;color:var(--ok);font-weight:600;margin-top:4px}
.edit{background:#EAF6EE;border:1px solid #BFE0CB;border-radius:12px;
  padding:12px 14px;margin:0 0 12px;font-size:15px;line-height:1.45;color:#1d4d31}
.edit button,.drop{display:block;width:100%;margin-top:10px;padding:11px 14px;
  border:1px solid #D9B4B4;border-radius:10px;background:#fff;color:#9B2C2C;
  font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.drop{margin-top:14px}
.edit button:active,.drop:active{background:#FBEDED}
.row .go{flex:0 0 auto;color:var(--mut);font-size:20px}
/* Строка-кнопка не должна выглядеть кнопкой: у <button> своя рамка, и она
   обводила каждый филиал жирным прямоугольником. Оставляем только разделитель. */
.row.tap{width:100%;text-align:left;border:0;border-top:1px solid var(--line);
  border-radius:0;background:var(--card);font:inherit;color:inherit}
.row.tap:first-child{border-top:0}
.row.tap:active{background:#FAF8F4}
.row.off .nm{color:var(--mut)}
.row.has{background:var(--okBg)}

/* ── степпер ── */
.st{flex:0 0 auto;display:flex;align-items:center;gap:2px}
.st button{
  width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);font-size:22px;line-height:1;font-weight:600;
}
.st button:disabled{opacity:.35}
.st .n{min-width:34px;text-align:center;font-size:18px;font-weight:700}
.st .n.zero{color:var(--mut);font-weight:400}

/* ── нижняя панель ── */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:6;
  background:var(--card);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .cnt{flex:1;min-width:0;font-size:14px;color:var(--mut);line-height:1.25;
  overflow:hidden}
.bar .cnt b{display:block;font-size:16px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{
  flex:0 0 auto;padding:14px 22px;border-radius:12px;border:0;
  background:var(--ok);color:#fff;font-size:17px;font-weight:600;
}
.bar button:disabled{background:#CFCBC2;color:#6B6559}

/* ── экран оформления ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:16px;font-weight:600}
.card .lbl{display:block;font-size:14px;color:var(--mut);margin:0 0 6px}
.card input[type=text]{
  display:block;width:100%;padding:14px;border:1px solid var(--line);
  border-radius:12px;background:var(--card);font-size:17px;
}
.card input[type=text]:focus{outline:none;border-color:var(--ok)}
.pickBtn{
  display:flex;width:100%;align-items:center;gap:10px;text-align:left;
  padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);
  font-size:17px;
}
.pickBtn span{flex:1;min-width:0}
.pickBtn.empty span{color:var(--mut)}
.tot{display:flex;justify-content:space-between;font-size:16px;padding-top:4px}
.tot b{font-weight:700}
.mini{font-size:14px;color:var(--mut);margin:8px 0 0}
.warn{font-size:14px;line-height:1.45;margin:10px 0 0;padding:10px 12px;border-radius:10px;
  background:#fff6e5;color:#7a4a00;border:1px solid #f0d9ad}
.note{background:#FFF7E8;border:1px solid #EBD9AE;border-radius:12px;
  padding:14px;margin-bottom:14px;font-size:16px}

/* ── готово ── */
.done{background:var(--okBg);border:1px solid #BFD9C6;border-radius:14px;
  padding:20px;margin-bottom:14px}
.done h2{margin:0 0 4px;font-size:20px}
.done .num{font-size:28px;font-weight:700;margin:6px 0 10px}
.done p{margin:4px 0;font-size:16px}

/* ── всплывающий выбор ── */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);
  display:flex;flex-direction:column}
.sheet[hidden]{display:none}
.sheet .h{background:var(--card);border-bottom:1px solid var(--line);padding:16px}
.sheet .h h2{margin:0;font-size:19px}
.sheet .b{flex:1;overflow:auto;padding:12px 16px;max-width:760px;width:100%;margin:0 auto}
.sheet .b button{
  display:block;width:100%;text-align:left;padding:16px;margin-bottom:10px;
  border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:17px;
}
.sheet .b button small{display:block;font-size:14px;color:var(--mut);margin-top:2px}
.sheet .f{padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  max-width:760px;width:100%;margin:0 auto}
.sheet .f button{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);font-size:17px}

/* Внутри Телеграма своя шапка сверху — наша строка с брендом её дублирует. */
.in-tg .brandline{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="top">
  <button class="back" id="back" type="button" aria-label="Назад">‹</button>
  <div class="ttl">
    <h1 id="ttl">Что уходит со скидкой</h1>
    <div class="sub" id="sub">загружаю…</div>
  </div>
  <button class="upd" id="upd" type="button" aria-label="Обновить">⟳</button>
</div>

<main id="app"></main>

<div class="bar" id="bar" hidden>
  <div class="in">
    <div class="cnt" id="barTxt"></div>
    <button id="barBtn" type="button">Продолжить</button>
  </div>
</div>

<div class="sheet" id="pick" hidden>
  <div class="h"><h2 id="pickT"></h2></div>
  <div class="b" id="pickB"></div>
  <div class="f"><button type="button" id="pickX">Отмена</button></div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function(){
  'use strict';

  /* ─── запуск внутри Телеграма ───
     Витрина открывается двумя путями: обычной ссылкой в браузере и
     мини-приложением внутри Телеграма. Код один; Телеграм добавляет ключ в
     startapp, имя из профиля и требует развернуть окно. */
  var TG = null, TG_NAME = '';
  try{ TG = (window.Telegram && window.Telegram.WebApp &&
             window.Telegram.WebApp.initData !== undefined)
            ? window.Telegram.WebApp : null; }catch(e){}
  if (TG){
    try{
      TG.ready(); TG.expand();
      document.documentElement.classList.add('in-tg');
      var u = TG.initDataUnsafe && TG.initDataUnsafe.user;
      if (u) TG_NAME = [u.first_name, u.last_name].filter(Boolean).join(' ').trim();
    }catch(e){}
  }

  var API = 'https://script.google.com/macros/s/AKfycbyB2zMJldSSbflPVmWqlJxWvBcRrI1agvAnGSYHeUVdvVElOTxbs3dPszB_IdqOm88zyg/exec';
  var STORE = 'tt_vitrina_key', MEKEY = 'tt_vitrina_me';
  var KEY = '';
  try{
    var qp = new URLSearchParams(location.search);
    var fromTg = TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param;
    if (qp.get('k') || fromTg){
      KEY = qp.get('k') || fromTg;
      localStorage.setItem(STORE, KEY);
      if (qp.get('k')) history.replaceState(null, '', location.pathname);
    } else {
      KEY = localStorage.getItem(STORE) || '';
    }
  }catch(e){}

  var DOW = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  var MON = ['января','февраля','марта','апреля','мая','июня','июля','августа',
             'сентября','октября','ноября','декабря'];
  function iso(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') +
           '-' + String(d.getDate()).padStart(2,'0');
  }
  function human(s){
    var p = String(s).split('-'), d = new Date(+p[0], +p[1]-1, +p[2]);
    return DOW[d.getDay()] + ', ' + (+p[2]) + ' ' + MON[+p[1]-1];
  }
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function el(id){ return document.getElementById(id); }
  function nrm(s){
    return String(s == null ? '' : s).replace(/[ёЁ]/g,'е')
           .replace(/\s+/g,' ').trim().toLowerCase();
  }
  function plural(n, a, b, c){
    var m = n % 100;
    if (m > 10 && m < 20) return c;
    m = n % 10;
    return m === 1 ? a : (m > 1 && m < 5 ? b : c);
  }
  function fmtQ(n){ return Math.round(n * 100) / 100; }

  /* Весовые позиции считают килограммами, целые торты режут пополам. Список
     тот же, что на странице филиала: правится одной строкой в обоих местах. */
  var WEIGHT = ['Печенье Вупи', 'Бауырсақ', 'Ірімшік ж/е картоп қосылған рогалик',
                'Көкнәр қосылған тоқаш', 'Қатпарлы сүзбелі тоқаш',
                'Қатпарлы тоқаш алмамен'];
  var WEIGHT_K = {};
  WEIGHT.forEach(function(n){ WEIGHT_K[nrm(n)] = 1; });
  var HALF_KAT = { 'торттар': 1, 'кіші торттар': 1 };
  function isKg(dish){ return !!WEIGHT_K[nrm(dish)]; }
  function isHalf(dish, cat){ return !isKg(dish) && !!HALF_KAT[nrm(cat)]; }
  function unitOf(dish){ return isKg(dish) ? 'кг' : 'шт'; }
  function stepOf(dish, cat){ return isKg(dish) ? 0.5 : isHalf(dish, cat) ? 0.5 : 1; }

  /* Филиалы перечислены здесь, чтобы показать и тех, кто список ещё не прислал:
     пустая строка «не прислали» — тоже нужная сотруднику информация. */
  var SHOPS = [
    ['ТТ1',  'Атакент',    'Тимирязева 38/1'],
    ['ТТ2',  'Сарыарка',   '4 мкр, 28/1'],
    ['ТТ3',  'Ламия',      'Ади Шарипова 145к2'],
    ['ТТ4',  'Ньютон',     'Ньютона 1а'],
    ['ТТ6',  'Автодом',    'Сатпаева 90/21'],
    ['ТТ8',  'Каратау',    'Щепкина 35б'],
    ['ТТ9',  'Бесағаш',    'Райымбека 168б'],
    ['ТТ10', 'Шұғыла',     'Шугыла 340/35к15'],
    ['ТТ11', 'Алма Сити',  'Алтын Орда 6/40а']
  ];
  /* Цех — такой же адресат, как филиал, но без номера. Сопоставление и здесь,
     и на сервере идёт по номеру, поэтому ЦЕХ ни с одним филиалом не спутается. */
  var CEH = 'ЦЕХ';
  /* Везут первым рейсом, он приходит к 8:00. Значит бронить «привезти» можно
     с вечера до 07:00; «заберу здесь» никуда не едет и открыто всегда.
     Часы у сервера свои — эта проверка только чтобы не давать нажать зря. */
  var BOOK_OPEN = 21, BOOK_CLOSE = 7;
  function bookOpen(){
    var h = new Date().getHours();
    return BOOK_OPEN <= BOOK_CLOSE ? (h >= BOOK_OPEN && h < BOOK_CLOSE)
                                   : (h >= BOOK_OPEN || h < BOOK_CLOSE);
  }
  function hhmm(h){ return (h < 10 ? '0' : '') + h + ':00'; }
  function numOf(s){ var m = String(s || '').match(/\d+/); return m ? +m[0] : 0; }
  /* Так же, как на сервере: есть номера — сравниваем номера, нет — текст.
     Иначе «ЦЕХ» и филиал без номера оба дали бы 0 и слиплись бы в одну точку. */
  function sameSpot(a, b){
    var na = numOf(a), nb = numOf(b);
    if (na && nb) return na === nb;
    return nrm(a) === nrm(b);
  }
  function shopTitle(br){
    if (nrm(br) === nrm(CEH)) return 'Цех';
    var n = numOf(br);
    for (var i = 0; i < SHOPS.length; i++) if (numOf(SHOPS[i][0]) === n)
      return SHOPS[i][0] + ' ' + SHOPS[i][1];
    return br;
  }
  function shopAddr(br){
    var n = numOf(br);
    for (var i = 0; i < SHOPS.length; i++) if (numOf(SHOPS[i][0]) === n) return SHOPS[i][2];
    return '';
  }

  /* ─── состояние ───
     Корзина живёт в пределах одного филиала: за полцены едут в одно место, а не
     собирают заказ по всему городу. Ушёл в другой филиал — корзина начинается
     заново, и это честно показано на экране. */
  var VIEW = 'shops';        // shops | items | cart | done
  var DAY = '', ROWS = [], BOOKS = [], STAFF = [], TRIPS = [];
  var BR = '', CAT = '', Q = '', CART = {}, ME = '', DEST = '', TRIP = '', RES = null;
  /* Номер брони, которую человек сейчас правит, или '' — если бронирует заново.
     Отличать обязательно: «подтвердить» и «сохранить изменения» — разные слова,
     а снять бронь можно только ту, что уже есть. */
  var EDIT = '';
  try{ ME = localStorage.getItem(MEKEY) || ''; }catch(e){}

  function rowsOf(br){
    return ROWS.filter(function(r){ return r.day === DAY && numOf(r.branch) === numOf(br); });
  }
  /* Сколько уже забронировали другие. Имён не показываем: сотруднику нужно
     знать, сколько осталось, а не кто взял. */
  function takenOf(br, dish){
    var t = 0;
    BOOKS.forEach(function(b){
      if (b.day !== DAY || numOf(b.branch) !== numOf(br) || b.dish !== dish) return;
      if (nrm(b.who) === nrm(ME)) return;       // своё старое — не чужое
      t += (+b.qty || 0);
    });
    return t;
  }
  function leftOf(br, dish, have){ return Math.max(0, have - takenOf(br, dish)); }
  /* Своя бронь в этом филиале на этот день. Берём из того же ответа, что и
     остатки, — отдельный запрос с телефона это лишняя секунда ожидания. */
  function myBook(br){
    if (!ME) return null;
    var items = {}, n = 0, dest = '', trip = '', num = '';
    BOOKS.forEach(function(b){
      if (b.day !== DAY || !sameSpot(b.branch, br) || nrm(b.who) !== nrm(ME)) return;
      items[b.dish] = (items[b.dish] || 0) + (+b.qty || 0); n++;
      if (b.dest) dest = b.dest;
      if (b.trip) trip = b.trip;
      if (b.num)  num  = String(b.num);
    });
    return n ? { items: items, dest: dest, trip: trip, num: num, pos: n } : null;
  }
  /* Вход в филиал: если бронь уже есть — открываем её же, а не пустую корзину.
     Иначе «изменить» выглядело бы как «забронировать ещё раз сверху». */
  function openShop(br){
    BR = br; Q = ''; CAT = '';
    var mb = myBook(br);
    CART = {};
    if (mb){
      EDIT = mb.num || '—';
      Object.keys(mb.items).forEach(function(d){ CART[d] = mb.items[d]; });
      DEST = mb.dest || br; TRIP = mb.trip || '';
    } else { EDIT = ''; DEST = ''; TRIP = ''; }
    go('items');
  }
  function cartCount(){
    var pos = 0, sht = 0, kg = 0;
    Object.keys(CART).forEach(function(k){
      if (!(CART[k] > 0)) return;
      pos++;
      if (isKg(k)) kg += CART[k]; else sht += CART[k];
    });
    return { pos: pos, qty: sht + kg, sht: sht, kg: kg };
  }
  /* Штуки и килограммы в одну цифру не сводим — «6 шт · 1.5 кг» честнее, чем
     «7.5» непонятно чего. */
  function cartQty(c){
    var t = [];
    if (c.sht) t.push(fmtQ(c.sht) + ' шт');
    if (c.kg)  t.push(fmtQ(c.kg) + ' кг');
    return t.join(' · ') || '0 шт';
  }
  function cartItems(){
    return Object.keys(CART).filter(function(k){ return CART[k] > 0; })
      .sort().map(function(k){ return { dish: k, qty: CART[k] }; });
  }

  /* ─── экран 1: филиалы ─── */
  function drawShops(){
    var q = nrm(Q);
    var body = SHOPS.map(function(s){
      var br = s[0] + ' ' + s[1];
      var rs = ROWS.filter(function(r){ return r.day === DAY && numOf(r.branch) === numOf(s[0]); });
      var hit = q ? rs.filter(function(r){ return nrm(r.dish).indexOf(q) >= 0; }) : rs;
      if (q && !hit.length) return '';
      var n = hit.length;
      var sub = !rs.length ? 'список ещё не прислали'
              : q ? (n + ' ' + plural(n, 'совпадение', 'совпадения', 'совпадений'))
              : (n + ' ' + plural(n, 'позиция', 'позиции', 'позиций'));
      /* Свою бронь показываем прямо здесь. Без этого «изменить» негде найти:
         человек видит список филиалов и не догадывается, что надо зайти внутрь. */
      var mb = myBook(br);
      return '<button class="row tap' + (rs.length ? '' : ' off') + '" type="button" ' +
             'data-shop="' + esc(br) + '"' + (rs.length ? '' : ' disabled') + '>' +
        '<div class="txt"><div class="nm">' + esc(br) + '</div>' +
        '<div class="sub">' + esc(sub) + (rs.length ? ' · ' + esc(s[2]) : '') + '</div>' +
        (mb ? '<div class="mine">Ваша бронь' + (mb.num ? ' №' + esc(mb.num) : '') +
              ' · ' + mb.pos + ' ' + plural(mb.pos, 'позиция', 'позиции', 'позиций') +
              ' — нажмите, чтобы изменить</div>' : '') +
        '</div>' +
        (rs.length ? '<div class="go">›</div>' : '') + '</button>';
    }).join('');

    el('app').innerHTML =
      '<input class="find" id="q" type="text" placeholder="Поиск продукции" ' +
        'autocomplete="off" autocorrect="off" spellcheck="false" value="' + esc(Q) + '">' +
      (body ? '<div class="list">' + body + '</div>'
            : '<div class="note">Ничего не нашлось. Попробуйте другое слово ' +
              'или очистите поиск.</div>');
    el('bar').hidden = true;
    bindSearch();
  }

  /* ─── экран 2: продукция филиала ─── */
  function drawItems(){
    var rs = rowsOf(BR), q = nrm(Q);
    var cats = {};
    rs.forEach(function(r){ cats[r.cat || 'Прочее'] = 1; });
    var catList = Object.keys(cats).sort();

    var vis = rs.filter(function(r){
      if (CAT && (r.cat || 'Прочее') !== CAT) return false;
      return !q || nrm(r.dish).indexOf(q) >= 0;
    });
    /* Кончившееся не прячем и не делаем полупрозрачным — просто уводим вниз:
       выцветший текст на телефоне не читается, а знать, что позиция была, полезно. */
    var live = [], out = [];
    vis.forEach(function(r){
      (leftOf(BR, r.dish, +r.qty || 0) > 0 ? live : out).push(r);
    });
    var byName = function(a, b){ return a.dish < b.dish ? -1 : 1; };
    live.sort(byName); out.sort(byName);

    function row(r, dead){
      var have = +r.qty || 0, left = leftOf(BR, r.dish, have), mine = CART[r.dish] || 0;
      if (dead) return '<div class="row off"><div class="txt">' +
        '<div class="nm">' + esc(r.dish) + '</div>' +
        '<div class="sub">Нет в наличии</div></div></div>';
      return '<div class="row' + (mine ? ' has' : '') + '">' +
        '<div class="txt"><div class="nm">' + esc(r.dish) + '</div>' +
        '<div class="sub">Осталось ' + fmtQ(left) + ' ' + unitOf(r.dish) + '</div></div>' +
        '<div class="st">' +
          '<button type="button" data-m="' + esc(r.dish) + '"' + (mine ? '' : ' disabled') + '>−</button>' +
          '<span class="n' + (mine ? '' : ' zero') + '">' + fmtQ(mine) + '</span>' +
          '<button type="button" data-p="' + esc(r.dish) + '"' +
            (mine >= left ? ' disabled' : '') + '>+</button>' +
        '</div></div>';
    }

    el('app').innerHTML =
      (EDIT
        ? '<div class="edit">Вы меняете свою бронь' +
          (EDIT !== '—' ? ' №' + esc(EDIT) : '') + '. Убавьте или добавьте что нужно ' +
          'и подтвердите заново — в брони останется то, что осталось в списке.' +
          '<button type="button" id="dropBook">Снять бронь целиком</button></div>'
        : '') +
      '<input class="find" id="q" type="text" placeholder="Поиск по названию" ' +
        'autocomplete="off" autocorrect="off" spellcheck="false" value="' + esc(Q) + '">' +
      (catList.length > 1
        ? '<div class="chips" id="chips">' +
          '<button type="button" class="' + (CAT ? '' : 'on') + '" data-c="">все</button>' +
          catList.map(function(c){
            return '<button type="button" class="' + (CAT === c ? 'on' : '') +
                   '" data-c="' + esc(c) + '">' + esc(c) + '</button>'; }).join('') +
          '</div>'
        : '') +
      (live.length || out.length
        ? '<div class="list">' + live.map(function(r){ return row(r, false); }).join('') +
          out.map(function(r){ return row(r, true); }).join('') + '</div>'
        : '<div class="note">В этой категории ничего нет.</div>');
    bindSearch();
    drawBar();
  }

  /* ─── нижняя панель ─── */
  function drawBar(){
    var c = cartCount();
    if (VIEW !== 'items'){ el('bar').hidden = true; return; }
    el('bar').hidden = false;
    el('barTxt').innerHTML = c.pos
      ? '<b>' + c.pos + ' ' + plural(c.pos, 'позиция', 'позиции', 'позиций') + '</b>' +
        cartQty(c)
      : EDIT
        ? '<b>В брони пусто</b>снимите бронь или верните позиции'
        : '<b>Выберите продукцию</b>нажимайте + у нужных позиций';
    el('barBtn').textContent = 'Продолжить';
    el('barBtn').disabled = !c.pos;
  }

  /* ─── экран 3: оформление ─── */
  function drawCart(){
    var items = cartItems();
    var c = cartCount();
    var here = DEST && sameSpot(DEST, BR);
    /* Убавление брони окно не закрывает — иначе человек, снявший одну позицию,
       упёрся бы в погашенную кнопку и снял бы всю бронь целиком. */
    var shut = !!DEST && !here && !bookOpen() && !onlyLess(items);
    el('app').innerHTML =
      '<div class="card"><h2>' + (EDIT ? 'Остаётся в брони' : 'Забираю') + '</h2>' +
        '<div class="sub" style="color:var(--mut);font-size:14px;margin-bottom:8px">' +
          esc(shopTitle(BR)) + '</div>' +
        items.map(function(i){
          return '<div class="row" style="padding:10px 0;border-top:1px solid var(--line)">' +
            '<div class="txt"><div class="nm">' + esc(i.dish) + '</div></div>' +
            '<div style="font-weight:700">' + fmtQ(i.qty) + ' ' + unitOf(i.dish) +
            '</div></div>';
        }).join('') +
      '</div>' +

      '<div class="card"><h2>Кто берёт</h2>' +
        '<label class="lbl" for="me">Имя и фамилия — как в учёте</label>' +
        '<input type="text" id="me" autocomplete="off" autocapitalize="words" ' +
          'placeholder="Например: Айгүл Сәрсенова" value="' + esc(ME) + '">' +
        (STAFF.length || TG_NAME
          ? '<p class="mini"><button type="button" id="pickMe" ' +
            'style="background:none;border:0;padding:0;color:var(--ok);' +
            'text-decoration:underline;font-size:15px">Выбрать из списка</button></p>'
          : '') +
      '</div>' +

      '<div class="card"><h2>Где заберёте</h2>' +
        '<button type="button" class="pickBtn' + (DEST ? '' : ' empty') + '" id="pickDest">' +
          '<span>' + esc(DEST ? (here ? 'Заберу здесь · ' + shopTitle(BR) : shopTitle(DEST))
                             : 'Выберите точку получения') + '</span><span class="go">›</span>' +
        '</button>' +
        (DEST && !here && TRIPS.length
          ? '<p class="mini">Каким рейсом везти</p>' +
            '<button type="button" class="pickBtn' + (TRIP ? '' : ' empty') + '" id="pickTrip">' +
              '<span>' + esc(TRIP || 'Выберите рейс') + '</span><span class="go">›</span>' +
            '</button>'
          : '') +
        /* Закрытое окно объясняем здесь же, а не в момент нажатия: человек
           должен понять причину до того, как наберёт корзину и упрётся. */
        (shut ? '<p class="warn">Везут первым рейсом — он приходит к 8:00. ' +
                'Бронь с доставкой открыта с ' + hhmm(BOOK_OPEN) + ' до ' + hhmm(BOOK_CLOSE) +
                '. Сейчас можно выбрать «Заберу здесь».</p>' : '') +
      '</div>' +

      '<div class="card"><div class="tot"><span>Итого</span>' +
        '<b>' + c.pos + ' ' + plural(c.pos, 'позиция', 'позиции', 'позиций') +
        ' · ' + cartQty(c) + '</b></div>' +
        (EDIT ? '<button type="button" class="drop" id="dropBook">Снять бронь целиком</button>'
              : '') +
      '</div>';

    el('bar').hidden = false;
    /* В панели держим короткую строку: длинная переносится в три ряда и
       выдавливает кнопку к краю экрана. */
    el('barTxt').innerHTML = shut
      ? '<b>' + c.pos + ' · ' + cartQty(c) + '</b>доставку забронируют с ' + hhmm(BOOK_OPEN)
      : '<b>' + c.pos + ' · ' + cartQty(c) + '</b>' +
        (EDIT ? 'старая бронь заменится этой' : 'проверьте и подтвердите');
    el('barBtn').textContent = EDIT ? 'Сохранить' : 'Подтвердить';
    el('barBtn').disabled = shut;

    el('me').oninput = function(){ ME = this.value; };
    if (el('pickMe')) el('pickMe').onclick = askWho;
    el('pickDest').onclick = askWhere;
    if (el('pickTrip')) el('pickTrip').onclick = askTrip;
  }

  /* ─── экран 4: готово ─── */
  function drawDone(){
    var r = RES || {};
    var off = r.mode === 'off';
    el('app').innerHTML =
      '<div class="done"><h2>' +
        (off ? 'Бронь снята' : r.mode === 'edit' ? 'Бронь изменена ✓' : 'Бронь оформлена ✓') +
      '</h2>' +
        (!off && r.num ? '<div class="num">№' + esc(r.num) + '</div>' : '') +
        '<p>' + esc(r.who) + '</p>' +
        (off
          ? '<p>Филиал: <b>' + esc(r.destTitle) + '</b></p>' +
            '<p>Продукция снова доступна остальным.</p>'
          : '<p>Получение: <b>' + esc(r.destTitle) + '</b>' +
            (r.trip ? ', ' + esc(r.trip) : '') + '</p>' +
            '<p>Дата: ' + esc(human(r.day)) + '</p>' +
            '<p>Позиций: ' + r.pos + ' · ' + esc(r.qtyText) + '</p>') +
        '<p class="mini" style="margin-top:10px">' +
          (r.told ? 'Филиал получил уведомление.' : 'Филиал увидит это на своём экране.') +
        '</p>' +
      '</div>';
    el('bar').hidden = false;
    el('barTxt').innerHTML = off ? '<b>Готово</b>бронь снята'
                                 : '<b>Готово</b>можно взять ещё';
    el('barBtn').textContent = 'К филиалам';
    el('barBtn').disabled = false;
  }

  /* ─── переходы ─── */
  function go(v){
    VIEW = v;
    /* CSS прячет стрелку по умолчанию, поэтому показывать надо явно:
       пустая строка вернула бы правило из стилей, то есть снова none. */
    el('back').style.display = (v === 'shops') ? 'none' : 'block';
    el('ttl').textContent =
      v === 'shops' ? 'Что уходит со скидкой' :
      v === 'items' ? shopTitle(BR) :
      v === 'cart'  ? 'Оформление брони' : 'Готово';
    el('sub').textContent =
      v === 'items' ? (shopAddr(BR) || human(DAY)) :
      DAY ? human(DAY) : '';
    window.scrollTo(0, 0);
    if (v === 'shops') drawShops();
    else if (v === 'items') drawItems();
    else if (v === 'cart') drawCart();
    else drawDone();
  }

  function bindSearch(){
    var i = el('q'); if (!i) return;
    i.oninput = function(){
      var p = this.selectionStart; Q = this.value;
      if (VIEW === 'shops') drawShops(); else drawItems();
      var j = el('q'); if (j){ j.focus(); try{ j.setSelectionRange(p, p); }catch(e){} }
    };
  }

  el('back').onclick = function(){
    if (VIEW === 'items'){ Q = ''; CAT = ''; go('shops'); }
    else if (VIEW === 'cart') go('items');
    else go('shops');
  };
  el('upd').onclick = function(){ load(); };
  el('barBtn').onclick = function(){
    if (VIEW === 'items'){
      if (!DEST) DEST = BR;
      go('cart');
    }
    else if (VIEW === 'cart') send();
    else { CART = {}; BR = ''; Q = ''; CAT = ''; DEST = ''; TRIP = ''; EDIT = ''; load(); }
  };

  document.addEventListener('click', function(e){
    var t = e.target;
    var shop = t.closest && t.closest('[data-shop]');
    if (shop){ openShop(shop.getAttribute('data-shop')); return; }
    if (t.closest && t.closest('#dropBook')){ cancelBook(); return; }
    var chip = t.closest && t.closest('[data-c]');
    if (chip && VIEW === 'items'){ CAT = chip.getAttribute('data-c'); drawItems(); return; }
    var plus = t.closest && t.closest('[data-p]');
    if (plus){ step(plus.getAttribute('data-p'), +1); return; }
    var minus = t.closest && t.closest('[data-m]');
    if (minus){ step(minus.getAttribute('data-m'), -1); return; }
  }, false);

  function step(dish, d){
    var r = rowsOf(BR).filter(function(x){ return x.dish === dish; })[0];
    if (!r) return;
    var left = leftOf(BR, dish, +r.qty || 0);
    var cur = CART[dish] || 0;
    /* Первое нажатие даёт целую единицу — килограмм или штуку. Дальше шагаем
       дробно: полкило добрать, торт взять половинкой. */
    var st = cur ? stepOf(dish, r.cat) : 1;
    var next = Math.min(left, Math.max(0, Math.round((cur + d * st) * 100) / 100));
    if (next) CART[dish] = next; else delete CART[dish];
    drawItems();
  }

  /* ─── всплывающий выбор ─── */
  var PICK = null;
  function sheet(title, items, pick){
    PICK = pick;
    el('pickT').textContent = title;
    el('pickB').innerHTML = items.map(function(it){
      return '<button type="button" data-v="' + esc(it.v) + '">' + esc(it.t) +
             (it.s ? '<small>' + esc(it.s) + '</small>' : '') + '</button>';
    }).join('');
    el('pick').hidden = false;
    el('pickB').scrollTop = 0;
  }
  el('pickX').onclick = function(){ el('pick').hidden = true; PICK = null; };
  el('pickB').addEventListener('click', function(e){
    var b = e.target.closest('button[data-v]'); if (!b || !PICK) return;
    var f = PICK; el('pick').hidden = true; PICK = null;
    f(b.getAttribute('data-v'));
  });

  /* Имя из профиля Телеграма — подсказка, а не подпись: там может стоять
     название компании, и подставленное в поле имя люди подтверждают не глядя. */
  function askWho(){
    var list = STAFF.map(function(n){ return { v: n, t: n }; });
    /* Профильное имя — последним. Первая строка в списке нажимается не глядя, а
       в профиле Телеграма может стоять что угодно: однажды так в бронь ушло
       название компании вместо человека. */
    if (TG_NAME && !STAFF.some(function(x){ return nrm(x) === nrm(TG_NAME); }))
      list.push({ v: TG_NAME, t: TG_NAME, s: 'из вашего профиля в Телеграме — проверьте' });
    if (!list.length) return;
    sheet('Кто берёт?', list, function(v){ ME = v; drawCart(); });
  }
  function askWhere(){
    var list = [{ v: BR, t: 'Заберу здесь', s: shopTitle(BR) }];
    SHOPS.forEach(function(s){
      if (numOf(s[0]) === numOf(BR)) return;
      list.push({ v: s[0] + ' ' + s[1], t: 'Привезти в ' + s[0] + ' ' + s[1], s: s[2] });
    });
    list.push({ v: CEH, t: 'Отвезти в цех', s: 'производство' });
    sheet('Где заберёте?', list, function(v){
      DEST = v;
      if (sameSpot(v, BR)) TRIP = '';
      drawCart();
    });
  }
  function askTrip(){
    sheet('Каким рейсом везти?', TRIPS.map(function(t){ return { v: t, t: t }; }),
      function(v){ TRIP = v; drawCart(); });
  }

  /* ─── отправка ─── */
  /* Снять бронь целиком — тот же запрос, только с пустым списком. Спрашиваем
     один раз: отменённую бронь обратно не вернуть, её разберут другие. */
  function cancelBook(){
    if (!EDIT) return;
    if (!confirm('Снять бронь' + (EDIT !== '—' ? ' №' + EDIT : '') + ' целиком?\n\n' +
                 'Продукция вернётся в общий список, и её смогут взять другие.')) return;
    post([], 'off');
  }

  /* Ничего не прибавилось и ничего нового не появилось — значит бронь только
     убавили. Сравниваем с той, что лежит в таблице, а не с началом сеанса. */
  function onlyLess(items){
    var mb = myBook(BR);
    if (!EDIT || !mb || !sameSpot(DEST, mb.dest || BR)) return false;
    for (var i = 0; i < items.length; i++)
      if (!((mb.items[items[i].dish] || 0) >= items[i].qty)) return false;
    return true;
  }

  function send(){
    var items = cartItems();
    if (!items.length) return;
    ME = String(ME || '').replace(/\s+/g, ' ').trim();
    if (!ME){ alert('Напишите, кто берёт.'); var m = el('me'); if (m) m.focus(); return; }
    if (!DEST) DEST = BR;
    var here = sameSpot(DEST, BR);
    /* Убавить бронь можно и днём: это только освобождает продукцию. А вот
       добавить — нет, филиал уже собрал коробку под первый рейс. Считаем то
       же самое, что и приёмник, чтобы человек узнал об отказе до отправки. */
    if (!here && !bookOpen() && !onlyLess(items)){
      alert('Бронь с доставкой открыта с ' + hhmm(BOOK_OPEN) + ' до ' + hhmm(BOOK_CLOSE) +
            ': везут первым рейсом, он приходит к 8:00.\n\n' +
            (EDIT ? 'Сейчас можно только убавить бронь или снять её целиком.'
                  : 'Сейчас можно выбрать «Заберу здесь».'));
      return;
    }
    if (!here && TRIPS.length && !TRIP){ askTrip(); return; }

    post(items, EDIT ? 'edit' : 'new');
  }

  /* Одна дорога наружу для всех трёх случаев: новая бронь, правка и снятие.
     Приёмник и так перезаписывает бронь человека за день целиком, поэтому
     «изменить» — это просто отправить новый список. */
  function post(items, mode){
    ME = String(ME || '').replace(/\s+/g, ' ').trim();
    if (!ME) return;
    if (!DEST) DEST = BR;
    var here = sameSpot(DEST, BR);
    try{ localStorage.setItem(MEKEY, ME); }catch(e){}
    var btn = el('barBtn'), was = btn.textContent;
    btn.disabled = true; btn.textContent = mode === 'off' ? 'Снимаю…' : 'Отправляю…';
    fetch(API, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'book', key: KEY, day: DAY, branch: BR,
                             who: ME, dest: DEST, trip: here ? '' : TRIP, items: items })
    }).then(function(r){ return r.text(); }).then(function(t){
      var j = null; try{ j = JSON.parse(t); }catch(e){}
      if (!j || j.error) throw new Error((j && j.error) || 'приёмник не ответил');
      var c = cartCount();
      RES = { mode: mode, num: j.num || EDIT, who: ME, day: DAY, told: j.told,
              destTitle: mode === 'off' ? shopTitle(BR)
                       : here ? shopTitle(BR) : shopTitle(DEST),
              trip: here ? '' : TRIP, pos: c.pos, qtyText: cartQty(c) };
      CART = {}; EDIT = '';
      go('done');
      load(true);            // тихо обновляем остатки под новым состоянием
    }).catch(function(e){
      btn.disabled = false; btn.textContent = was;
      el('app').insertAdjacentHTML('afterbegin',
        '<div class="note"><b>' + (mode === 'off' ? 'Бронь не снялась.' : 'Бронь не ушла.') +
        '</b><br>' + esc(e.message) +
        '<br>Проверьте интернет и нажмите ещё раз.</div>');
      window.scrollTo(0, 0);
    });
  }

  /* ─── загрузка ─── */
  function ask(from, to){
    return fetch(API, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'board', key: KEY, from: from, to: to })
    }).then(function(r){ return r.text(); }).then(function(t){
      var j = null; try{ j = JSON.parse(t); }catch(e){}
      if (!j || j.error) throw new Error((j && j.error) || 'приёмник не ответил');
      return j;
    });
  }

  function fail(msg){
    el('sub').textContent = 'не получилось';
    el('app').innerHTML = '<div class="note"><b>Список не загрузился.</b><br>' +
      esc(msg) + '<br><br>Проверьте интернет и нажмите ⟳ наверху.</div>';
    el('bar').hidden = true;
  }

  function load(quiet){
    var b = el('upd');
    b.disabled = true;
    if (!KEY){
      fail('Откройте ссылку, которую прислала бухгалтерия, — в ней ключ.');
      b.disabled = false; return;
    }
    var now = new Date(), today = iso(now);
    var tm = new Date(now.getTime()); tm.setDate(tm.getDate() + 1);
    var tomorrow = iso(tm);
    /* Просим сразу два дня. Завтрашние списки филиалы присылают вечером, и днём
       их ещё нет — тогда показываем сегодняшний, а не пустой экран. */
    ask(today, tomorrow).then(function(res){
      var rows = res.rows || [];
      BOOKS = res.books || [];
      STAFF = res.staff || [];
      TRIPS = res.trips || [];
      var t = rows.filter(function(r){ return r.day === tomorrow; });
      DAY = t.length ? tomorrow : today;
      ROWS = rows;
      b.disabled = false;
      if (quiet){ if (VIEW === 'items') drawItems(); return; }
      go(BR && rowsOf(BR).length ? 'items' : 'shops');
    }).catch(function(e){
      b.disabled = false;
      if (!quiet) fail(e.message || String(e));
    });
  }

  load();
})();
</script>
</body>
</html>
